name: Build RuneSystem

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build with Maven
        run: |
          POM_DIR=$(find "$GITHUB_WORKSPACE" -maxdepth 4 -name "pom.xml" -exec dirname {} \; | head -n 1)
          echo "Bulunan klasör: $POM_DIR"
          cd "$POM_DIR"
          mvn -B package

      - name: Find jar
        id: findjar
        run: |
          JAR_PATH=$(find "$GITHUB_WORKSPACE" -name "RuneSystem.jar" -path "*/target/*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Bulunan jar: $JAR_PATH"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RuneSystem
          path: ${{ steps.findjar.outputs.jar_path }}
