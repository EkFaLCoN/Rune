name: Build RuneSystem

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Show repo structure
        run: find "$GITHUB_WORKSPACE" -maxdepth 5

      - name: Build with Maven
        run: |
          set -e
          POM_PATH=$(find "$GITHUB_WORKSPACE" -type f -name "pom.xml" | head -n 1)
          if [ -z "$POM_PATH" ]; then
            echo "pom.xml bulunamadı!"
            exit 1
          fi
          POM_DIR=$(dirname "$POM_PATH")
          echo "Bulunan pom.xml: $POM_PATH"
          cd "$POM_DIR"
          pwd
          ls -la
          mvn -B package

      - name: Find jar
        id: findjar
        run: |
          JAR_PATH=$(find "$GITHUB_WORKSPACE" -type f -name "RuneSystem.jar" -path "*/target/*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Bulunan jar: $JAR_PATH"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RuneSystem
          path: ${{ steps.findjar.outputs.jar_path }}
