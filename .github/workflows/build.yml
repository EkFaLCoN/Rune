name: Build RuneSystem

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Find pom.xml
        id: findpom
        run: |
          POM_PATH=$(find . -maxdepth 3 -name "pom.xml" | head -n 1)
          echo "pom_path=$POM_PATH" >> "$GITHUB_OUTPUT"
          echo "Bulunan pom.xml: $POM_PATH"

      - name: Build with Maven
        run: mvn -B package --file "${{ steps.findpom.outputs.pom_path }}"

      - name: Find jar
        id: findjar
        run: |
          JAR_PATH=$(find . -name "RuneSystem.jar" -path "*/target/*" | head -n 1)
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: RuneSystem
          path: ${{ steps.findjar.outputs.jar_path }}
